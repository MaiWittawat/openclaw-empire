services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claw-empire-backend
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-psql}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-claw_admin}
      DB_PASS: ${DB_PASS:-claw_admin}
      DB_NAME: ${DB_NAME:-claw_admin}
      SERVER_NAME: ${SERVER_NAME:-CLAW_EMPIRE}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8212}
      SERVER_MODE: ${SERVER_MODE:-prod}
      OPENCLAW_GATEWAY_WS_URL: ${OPENCLAW_GATEWAY_WS_URL:-ws://host.docker.internal:18789/ws}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_DEFAULT_SESSION_KEY: ${OPENCLAW_DEFAULT_SESSION_KEY:-main}
      OPENCLAW_DEVICE_STORE_PATH: ${OPENCLAW_DEVICE_STORE_PATH:-/app/data/openclaw/device.json}
      OPENCLAW_CLIENT_ID: ${OPENCLAW_CLIENT_ID:-openclaw-empire}
      OPENCLAW_CLIENT_VERSION: ${OPENCLAW_CLIENT_VERSION:-1.0.0}
      OPENCLAW_CLIENT_PLATFORM: ${OPENCLAW_CLIENT_PLATFORM:-linux}
      OPENCLAW_CLIENT_DEVICE_FAMILY: ${OPENCLAW_CLIENT_DEVICE_FAMILY:-server}
      OPENCLAW_RECONNECT_DELAY_MS: ${OPENCLAW_RECONNECT_DELAY_MS:-3000}
      OPENCLAW_COMMAND_TIMEOUT_MS: ${OPENCLAW_COMMAND_TIMEOUT_MS:-15000}
      OPENCLAW_ACTIVE_WINDOW_MINUTE: ${OPENCLAW_ACTIVE_WINDOW_MINUTE:-15}
    volumes:
      - backend_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - web-proxy-net
    restart: unless-stopped

volumes:
  backend_data:

networks:
  web-proxy-net:
    external: true
